# Optional overlay: GCS via a service-account JSON key (local dev only).
# Staging/production do NOT use this — they use the GCE VM service account.
# Prefer docker-compose.gcs-adc.yml + gcloud auth application-default login when possible.
#
# Example:
#   export GCS_BUCKET=your-bucket-name
#   export GCS_SA_KEY_FILE=/absolute/path/to/service-account.json
#   docker compose -f docker-compose.dev.yml -f docker-compose.gcs.yml up --build
#
services:
  nodeodm:
    environment:
      GCS_BUCKET: ${GCS_BUCKET}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_UPLOAD_PATHS: ${GCS_UPLOAD_PATHS:-.}
      GCS_UPLOAD_PREFIX: ${GCS_UPLOAD_PREFIX:-outputs}
      GCS_KEY_PATH: /run/secrets/gcs-sa.json
    volumes:
      - ${GCS_SA_KEY_FILE}:/run/secrets/gcs-sa.json:ro
