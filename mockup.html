<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NodeODM — Upload (mockup)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a222d;
            --surface-2: #232d3b;
            --border: #2d3a4d;
            --text: #e8eef4;
            --muted: #8b9cb3;
            --accent: #3d9cf0;
            --accent-dim: #2b7fc4;
            --success: #3ecf8e;
            --warn: #e8b84a;
            --radius: 14px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            --space-section: 1.5rem;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "DM Sans", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 156, 240, 0.18), transparent),
                var(--bg);
        }

        .shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 2.5rem;
        }

        .page-header {
            margin-bottom: 1.75rem;
        }

        .page-header h1 {
            margin: 0 0 0.35rem;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin: 0;
            max-width: 52ch;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .badge-mock {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.125rem 0.625rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            background: rgba(61, 156, 240, 0.15);
            border: 1px solid rgba(61, 156, 240, 0.35);
            border-radius: 999px;
            vertical-align: middle;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.375rem;
        }

        @media (min-width: 960px) {
            .grid {
                grid-template-columns: minmax(300px, 400px) 1fr;
                align-items: start;
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-body {
            padding: 1.375rem 1.5rem;
        }

        .card-title {
            margin: 0 0 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .section {
            margin-top: var(--space-section);
        }

        .section:first-of-type {
            margin-top: 0;
        }

        /* Block-level flex label: inline <label> + block children causes broken overlap/wrap */
        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            min-height: 7.25rem;
            padding: 1.75rem 1.25rem;
            border: 2px dashed var(--border);
            border-radius: 12px;
            text-align: center;
            background: var(--surface-2);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        .drop-zone:hover,
        .drop-zone:focus-within {
            border-color: var(--accent);
            background: rgba(61, 156, 240, 0.06);
        }

        .drop-zone.dragover {
            border-color: var(--success);
            background: rgba(62, 207, 142, 0.08);
        }

        .drop-zone__copy {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            max-width: 100%;
            pointer-events: none;
            line-height: 1.45;
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            opacity: 0;
            cursor: pointer;
            font-size: 1rem;
        }

        .drop-zone .title {
            font-size: 1rem;
            font-weight: 600;
        }

        .drop-zone .hint {
            font-size: 0.875rem;
            color: var(--muted);
            max-width: 28ch;
        }

        .file-panel {
            margin-top: 1rem;
        }

        .file-panel[hidden] {
            display: none !important;
        }

        .file-list {
            margin: 0;
            padding: 0;
            list-style: none;
            max-height: 11rem;
            overflow-y: auto;
            font-size: 0.8125rem;
        }

        .file-list li {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.35rem 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .file-list li:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .file-list .name {
            flex: 1 1 140px;
            min-width: 0;
            font-weight: 500;
            color: var(--text);
            word-break: break-word;
        }

        .file-list .meta {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .file-list .gps {
            flex: 1 0 100%;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .file-list .gps.has {
            color: var(--success);
        }

        .file-list .gps.missing {
            color: var(--warn);
        }

        fieldset {
            border: none;
            margin: 0;
            padding: 0;
        }

        legend {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .option-row {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        .radio-pill {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .radio-pill:has(input:checked) {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .radio-pill input {
            margin-top: 0.2rem;
            accent-color: var(--accent);
        }

        .radio-pill .label {
            font-weight: 600;
            color: var(--text);
        }

        .radio-pill .desc {
            display: block;
            font-size: 0.8125rem;
            font-weight: 400;
            color: var(--muted);
            margin-top: 0.125rem;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
        }

        .checkbox-row input {
            margin-top: 0.25rem;
            accent-color: var(--accent);
        }

        .checkbox-row .label {
            font-weight: 500;
        }

        .checkbox-row .desc {
            display: block;
            font-size: 0.8125rem;
            color: var(--muted);
            margin-top: 0.125rem;
        }

        .actions {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

        .btn-primary {
            appearance: none;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.375rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0a0e12;
            background: linear-gradient(165deg, var(--accent), var(--accent-dim));
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(61, 156, 240, 0.35);
            transition: transform 0.15s, filter 0.15s;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-ghost {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6875rem 1.125rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .map-card .card-body {
            padding: 0;
        }

        .map-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .map-header h2 {
            margin: 0 0 0.25rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .map-header .sub {
            margin: 0;
            font-size: 0.8125rem;
            color: var(--muted);
            line-height: 1.45;
        }

        .map-header .sub.loading {
            color: var(--accent);
        }

        #map {
            height: min(52vh, 520px);
            min-height: 320px;
            width: 100%;
            background: var(--surface-2);
        }

        .leaflet-container {
            font-family: "DM Sans", system-ui, sans-serif;
        }

        .map-popup {
            font-size: 13px;
            line-height: 1.45;
        }

        .map-popup strong {
            color: #1a222d;
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="page-header">
            <h1>New processing job <span class="badge-mock">UI mockup</span></h1>
            <p>Select images with GPS in EXIF (JPEG, PNG, TIFF). Markers update from embedded coordinates; submit is still a mock.</p>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">Inputs</div>

                    <section class="section">
                        <label class="drop-zone" id="dropZone">
                            <input type="file" id="fileInput" multiple accept="image/*,.tif,.tiff,.jpg,.jpeg,.png,.heic,.heif,.webp">
                            <span class="drop-zone__copy">
                                <span class="title">Drop images here or click to browse</span>
                                <span class="hint">Drone or phone photos with location tags work best.</span>
                            </span>
                        </label>

                        <div class="file-panel" id="filePanel" hidden>
                            <ul class="file-list" id="fileList"></ul>
                        </div>
                    </section>

                    <section class="section">
                        <fieldset>
                            <legend>Processing</legend>
                            <div class="option-row">
                                <label class="radio-pill">
                                    <input type="radio" name="processing" value="3d" checked>
                                    <span>
                                        <span class="label">3D reconstruction</span>
                                        <span class="desc">Dense point cloud, mesh, and related outputs.</span>
                                    </span>
                                </label>
                                <label class="radio-pill">
                                    <input type="radio" name="processing" value="ortho">
                                    <span>
                                        <span class="label">Ortho only</span>
                                        <span class="desc">Orthophoto / 2D products without full 3D.</span>
                                    </span>
                                </label>
                            </div>
                        </fieldset>
                    </section>

                    <section class="section">
                        <label class="checkbox-row">
                            <input type="checkbox" id="saveRaw" name="saveRaw">
                            <span>
                                <span class="label">Save raw inputs</span>
                                <span class="desc">Keep originals on the server with results when wired to the API.</span>
                            </span>
                        </label>
                    </section>

                    <div class="actions">
                        <button type="button" class="btn-primary" id="btnStart">Start job (mock)</button>
                        <button type="button" class="btn-ghost" id="btnClear">Clear files</button>
                    </div>
                </div>
            </div>

            <div class="card map-card">
                <div class="card-body">
                    <div class="map-header">
                        <h2>Image locations</h2>
                        <p class="sub" id="mapStatus">Add images to read GPS from EXIF.</p>
                    </div>
                    <div id="map" role="application" aria-label="Map of image GPS positions from EXIF"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        (function () {
            var DEFAULT_VIEW = { center: [20, 0], zoom: 2 };
            var dropZone = document.getElementById("dropZone");
            var fileInput = document.getElementById("fileInput");
            var filePanel = document.getElementById("filePanel");
            var fileList = document.getElementById("fileList");
            var mapStatus = document.getElementById("mapStatus");
            var btnClear = document.getElementById("btnClear");
            var btnStart = document.getElementById("btnStart");

            var map = L.map("map", { scrollWheelZoom: true }).setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);
            L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
                attribution: "&copy; OpenStreetMap &copy; CARTO",
                subdomains: "abcd",
                maxZoom: 20
            }).addTo(map);

            var markerLayer = L.layerGroup().addTo(map);

            function setStatus(text, loading) {
                mapStatus.textContent = text;
                mapStatus.classList.toggle("loading", !!loading);
            }

            function escapeHtml(s) {
                var div = document.createElement("div");
                div.textContent = s;
                return div.innerHTML;
            }

            function formatCoord(n) {
                return (typeof n === "number" && !isNaN(n)) ? n.toFixed(6) : "—";
            }

            function isImageFile(file) {
                if (file.type && file.type.indexOf("image/") === 0) return true;
                return /\.(jpe?g|png|tiff?|heic|heif|webp|avif)$/i.test(file.name);
            }

            function mergeFilesFromDrop(dataTransfer) {
                var dt = new DataTransfer();
                var seen = Object.create(null);
                var i;
                for (i = 0; i < fileInput.files.length; i++) {
                    var f = fileInput.files[i];
                    dt.items.add(f);
                    seen[f.name + ":" + f.size] = true;
                }
                for (i = 0; i < dataTransfer.files.length; i++) {
                    var d = dataTransfer.files[i];
                    if (!isImageFile(d)) continue;
                    var key = d.name + ":" + d.size;
                    if (seen[key]) continue;
                    seen[key] = true;
                    dt.items.add(d);
                }
                fileInput.files = dt.files;
            }

            dropZone.addEventListener("dragover", function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add("dragover");
            });

            dropZone.addEventListener("dragleave", function (e) {
                e.preventDefault();
                dropZone.classList.remove("dragover");
            });

            dropZone.addEventListener("drop", function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove("dragover");
                mergeFilesFromDrop(e.dataTransfer);
                onFilesChanged();
            });

            function renderFileRows(results) {
                fileList.innerHTML = "";
                if (!results.length) {
                    filePanel.hidden = true;
                    return;
                }
                filePanel.hidden = false;
                results.forEach(function (r) {
                    var li = document.createElement("li");
                    var name = document.createElement("span");
                    name.className = "name";
                    name.textContent = r.file.name;
                    var meta = document.createElement("span");
                    meta.className = "meta";
                    meta.textContent = (r.file.size / (1024 * 1024)).toFixed(2) + " MB";
                    var gps = document.createElement("span");
                    gps.className = "gps";
                    if (r.lat != null && r.lng != null) {
                        gps.classList.add("has");
                        gps.textContent = "GPS " + formatCoord(r.lat) + ", " + formatCoord(r.lng);
                    } else {
                        gps.classList.add("missing");
                        gps.textContent = r.error ? "Could not read GPS (" + r.error + ")" : "No GPS in EXIF";
                    }
                    li.appendChild(name);
                    li.appendChild(meta);
                    li.appendChild(gps);
                    fileList.appendChild(li);
                });
            }

            function updateMap(points) {
                markerLayer.clearLayers();
                if (!points.length) {
                    map.setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);
                    return;
                }
                var latlngs = points.map(function (p) {
                    return [p.lat, p.lng];
                });
                points.forEach(function (p) {
                    var m = L.circleMarker([p.lat, p.lng], {
                        radius: 7,
                        fillColor: "#3d9cf0",
                        color: "#1a222d",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.88
                    });
                    m.bindPopup(
                        "<div class=\"map-popup\"><strong>" + escapeHtml(p.file.name) + "</strong><br>" +
                        "Lat " + formatCoord(p.lat) + ", Lng " + formatCoord(p.lng) + "</div>"
                    );
                    markerLayer.addLayer(m);
                });
                if (latlngs.length === 1) {
                    map.setView(latlngs[0], 17);
                } else {
                    var b = L.latLngBounds(latlngs);
                    map.fitBounds(b, { padding: [40, 40], maxZoom: 18 });
                }
            }

            async function readGpsForFile(file) {
                try {
                    var gps = await exifr.gps(file);
                    if (gps && typeof gps.latitude === "number" && typeof gps.longitude === "number") {
                        return { file: file, lat: gps.latitude, lng: gps.longitude };
                    }
                } catch (err) {
                    return { file: file, lat: null, lng: null, error: (err && err.message) ? err.message : "parse error" };
                }
                return { file: file, lat: null, lng: null };
            }

            async function onFilesChanged() {
                var files = fileInput.files ? Array.from(fileInput.files).filter(isImageFile) : [];
                if (!files.length) {
                    renderFileRows([]);
                    updateMap([]);
                    setStatus("Add images to read GPS from EXIF.");
                    return;
                }
                setStatus("Reading GPS from EXIF…", true);
                var results = await Promise.all(files.map(readGpsForFile));
                renderFileRows(results);
                var withGps = results.filter(function (r) {
                    return r.lat != null && r.lng != null;
                });
                updateMap(withGps);
                if (!withGps.length) {
                    setStatus("No GPS tags found in " + files.length + " image(s). Try photos taken with location on.");
                } else if (withGps.length < files.length) {
                    setStatus(withGps.length + " of " + files.length + " images have GPS — shown on the map.");
                } else {
                    setStatus(withGps.length + " images plotted from EXIF GPS.");
                }
            }

            fileInput.addEventListener("change", function () {
                onFilesChanged();
            });

            btnClear.addEventListener("click", function () {
                fileInput.value = "";
                onFilesChanged();
            });

            btnStart.addEventListener("click", function () {
                var mode = document.querySelector('input[name="processing"]:checked');
                var raw = document.getElementById("saveRaw").checked;
                var n = fileInput.files ? fileInput.files.length : 0;
                window.alert(
                    "Mock only — not sent to the server.\n\n" +
                    "Files selected: " + n + "\n" +
                    "Processing: " + (mode ? mode.value : "?") + "\n" +
                    "Save raw inputs: " + raw
                );
            });

            window.addEventListener("resize", function () {
                map.invalidateSize();
            });
        })();
    </script>
</body>
</html>
