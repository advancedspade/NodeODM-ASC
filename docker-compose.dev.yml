# Development: bind-mounts + nodemon auto-restart when server-side files change.
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# With GCS uploads (manual Uploads page + task output sync):
#   Add GCS_BUCKET (+ GCS_UPLOAD_PREFIX) to .env — see env.gcs.example.
#   Auth (pick one for local Docker):
#     • gcloud ADC:  docker compose -f docker-compose.dev.yml -f docker-compose.gcs-adc.yml up
#     • JSON key:    docker compose -f docker-compose.dev.yml -f docker-compose.gcs.yml up
#   On GCE (staging), only --gcs_bucket is passed; the VM service account handles auth.
#
# Local ODM runs on CPU (no GPU). mem_limit/shm_size below are for OpenMVS dense recon;
# raise mem_limit (e.g. 24g) if you have RAM and still hit OOM. NODEODM_LOCAL_CPU=1
# uses lighter defaults (5 cm ortho, low pc-quality) — not staging's 0.1 cm settings.
#
# Hot reload expectations:
# - There is no in-browser HMR (no webpack live reload). Edits under public/ are served
#   from the bind mount immediately, but you must refresh the tab (hard refresh if needed).
# - libs/, index.js, etc.: nodemon restarts the Node process (see nodemon.json). Login page is public/login.html (refresh browser).
#   --legacy-watch makes file events reliable through Docker bind mounts (some hosts drop native fs.watch).
# - package.json dependency changes: rebuild image or npm install in the container.
# - If you use plain `docker compose up` (default compose file) without this file, the image
#   COPYs the tree at build time — edits on the host will not appear until rebuild.

services:
  nodeodm:
    build: .
    image: nodeodm-asc-local:latest
    env_file:
      - .env
    environment:
      # Express static uses ETag by default — browsers often keep old CSS/JS without this.
      NODEODM_DEV_STATIC_NO_CACHE: "1"
      # CPU-friendly ODM defaults (5 cm ortho, low point cloud, no-gpu) — see libs/odmUiDefaults.js
      NODEODM_LOCAL_CPU: "1"
      # OAuth credentials come from .env. To run standalone without login, add
      # -f docker-compose.no-oauth.yml. Local origins are http, so the session
      # cookie must not be Secure or the browser drops it after the callback.
      OAUTH_COOKIE_SECURE: "0"
      # With OAuth on, /info also needs auth, and a gateway health probe carries
      # no cookie. This token is what ClusterODM's REFERENCE_NODE_TOKEN must be,
      # otherwise the gateway marks this node offline and serves 503.
      NODEODM_TOKEN: "local-reference-node-token"
      # Optional — set in .env to enable GCS (requires gcs compose file for SA key mount)
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_UPLOAD_PREFIX: ${GCS_UPLOAD_PREFIX:-outputs}
      GCS_KEY_PATH: ${GCS_KEY_PATH:-}
      # Optional — Shelby Cloud base URL. Feedback buttons stay hidden when unset.
      SUPPORT_API_URL: ${SUPPORT_API_URL:-}
    ports:
      - "4000:3000"
    mem_limit: 16g
    shm_size: 2gb
    entrypoint: ["/usr/bin/nodemon", "--legacy-watch"]
    volumes:
      - ./public:/var/www/public
      - ./index.js:/var/www/index.js
      - ./libs:/var/www/libs
      - ./config.js:/var/www/config.js
      - ./config-default.json:/var/www/config-default.json
      - ./nodemon.json:/var/www/nodemon.json
      - ./helpers:/var/www/helpers
      - ./docs:/var/www/docs
    command: ["/var/www/index.js", "--", "--port", "3000"]
    restart: unless-stopped
